<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Deporte Total TV</title>

<style>

:root{
    --espn-red:#E10600;
    --green:#1DB954;
    --bg:#050505;
    --text:#ffffff;
    --text-secondary:#bdbdbd;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

/* HERO */

.hero{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px 20px;

    background:
    radial-gradient(
        circle at center,
        #1a1a1a 0%,
        #090909 60%,
        #000000 100%
    );

    position:relative;

    overflow:hidden;
}

.hero::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
    rgba(225,6,0,.08);

    filter:blur(80px);

    z-index:0;
}

.container{

    width:100%;
    max-width:1200px;

    margin:auto;

    text-align:center;

    position:relative;
    z-index:2;
}

/* FRANJA */

.worldcup-banner{

    width:100%;

    background:#169b45;

    color:white;

    font-weight:700;

    font-size:14px;

    padding:10px 15px;

    margin-bottom:25px;

    text-align:center;

    letter-spacing:.5px;
}

/* TITULO */

h1{

    color:#E10600;

    font-size:
    clamp(2.2rem,7vw,5rem);

    margin-bottom:15px;

    font-weight:900;
}

p{

    color:#bdbdbd;

    font-size:
    clamp(1rem,2vw,1.25rem);

    margin-bottom:30px;
}

/* DESKTOP IMAGE */

.hero-image{

    width:100%;
}

.hero-image img{

    width:100%;
    max-width:1000px;

    display:block;

    margin:auto;
}

/* MOBILE CAROUSEL */

.mobile-slider{

    display:none;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

    gap:18px;

    padding:10px 0 10px 20px;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;
}

.mobile-slider::-webkit-scrollbar{
    display:none;
}

.slide{

    flex:0 0 75%;

    scroll-snap-align:start;
}

.slide img{

    width:100%;

    display:block;

    border-radius:24px;

    box-shadow:
    0 20px 40px rgba(0,0,0,.45);
}

/* BOTON */

.download-btn{

    display:inline-block;

    background:#1DB954;

    color:white;

    text-decoration:none;

    font-weight:bold;

    padding:18px 34px;

    border-radius:999px;

    margin-top:35px;

    transition:.2s;
}

.download-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(29,185,84,.35);
}

/* FOOTER */

footer{

    text-align:center;

    color:#777;

    padding:25px;
}

/* MOBILE */

@media (max-width:768px){

    .hero{
        padding:25px 15px;
    }

    .hero-image{
        display:none;
    }

    .mobile-slider{
        display:flex;
    }

    .download-btn{

        width:100%;
        max-width:320px;
    }

    .worldcup-banner{
        font-size:12px;
    }

    .slide{
        flex:0 0 75%;
    }
}

</style>

</head>

<body>

<section class="hero">

    <div class="container">

        <div class="worldcup-banner">
            🏆 TODOS LOS PARTIDOS DEL MUNDIAL 2026⚽
        </div>

        <h1>Deporte Total TV</h1>

        <p>
            Todos los eventos deportivos en vivo en tu móvil ⚽🏀🎾🥊🏆🔥
        </p>

        <!-- DESKTOP -->

        <div class="hero-image">

            <img
                src="app-preview.png"
                alt="Deporte Total TV">

        </div>

        <!-- MOBILE -->

        <div class="mobile-slider">

            <div class="slide">
                <img src="uno2.png" alt="Agenda">
            </div>

            <div class="slide">
                <img src="dos.png" alt="Canales">
            </div>

            <div class="slide">
                <img src="tres.png" alt="Partidos">
            </div>

        </div>

        <a
            class="download-btn"
            href="https://drive.google.com/file/d/10M8sUYANJVgWqY5xl4yzIBZmDcExBSRK/view?usp=sharing">
			

            Descargar App (última versión)

        </a>

    </div>

</section>

<footer>
    © 2025 Deporte Total TV
</footer>

</body>
</html>
